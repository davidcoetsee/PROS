# SPDX-License-Identifier: MPL-2.0
name: Windows tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements-windows-x64.lock
      - name: Build and verify the one-file release
        run: .\build.ps1
