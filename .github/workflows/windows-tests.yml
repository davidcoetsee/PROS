# SPDX-License-Identifier: MPL-2.0
name: Windows tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13.15"
          cache: pip
          cache-dependency-path: requirements-windows-x64.lock
      - name: Build and verify the one-file release
        run: .\build.ps1
